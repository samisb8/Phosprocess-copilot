[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phosprocess-copilot"
version = "0.1.0"
description = "Intelligent assistant for wet-process phosphoric acid production."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Sami Bachtaoui" }
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "ollama==0.6.2",
    "pymupdf",
    "pymupdf4llm",
    "docling==2.115.0",
    "pydantic>=2,<3",
    "pydantic-settings",
    "FlagEmbedding==1.4.0",
    "faiss-cpu==1.14.3",
    "bm25s==0.3.10",
    "scipy>=1.11,<2",
    "transformers==4.57.3",
    "ranx==0.3.21",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "data/evaluation/retrieval/v0.1/frozen",
    "scripts/build_gold_evidence.py",
    "scripts/compare_relevance_judgments.py",
    "scripts/draft_relevance_with_ollama.py",
    "scripts/draft_relevance_with_ollama_v2.py",
    "scripts/evaluate_dense_reranked_dev.py",
    "scripts/evaluate_hybrid_reranked_dev.py",
    "scripts/evaluate_hybrid_reranked_dev_v2.py",
    "scripts/evaluate_hybrid_reranked_dev_v2_expanded_query.py",
    "scripts/evaluate_hybrid_reranked_dev_v2_no_metadata.py",
    "scripts/evaluate_retrieval_dev.py",
    "scripts/export_questions_batch.py",
    "scripts/export_reference_answers.py",
    "scripts/inspect_q015_reranker_input.py",
    "scripts/propose_gold_evidence_with_ollama.py",
    "scripts/review_gold_evidence_test_v2.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "-q",
    "--ignore=tests/test_auto_verify_gold_evidence_test_v2.py",
    "--ignore=tests/test_evaluate_hybrid_reranked_test_v2.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["phosprocess"]
