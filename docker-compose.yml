services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: phosprocess-api:rag-v1.0.0

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_HOST: http://host.docker.internal:11434

    ports:
      - "${API_HOST_PORT:-8000}:8000"

    volumes:
      - type: bind
        source: ./data/knowledge_base
        target: /app/data/knowledge_base
        read_only: true

      - type: bind
        source: ${USERPROFILE}/.cache/huggingface
        target: /root/.cache/huggingface
        read_only: true

    gpus: all

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn phosprocess.api.main:app --host 0.0.0.0 --port 8000"
      ]

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: phosprocess-frontend:0.3.0
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.13.2
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  nvidia_gpu_exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.13.1
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports:
      - "${GPU_EXPORTER_HOST_PORT:-9835}:9835"
    restart: unless-stopped

volumes:
  grafana_data:
  postgres_data:
  prometheus_data:
